<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RRR</title>
  <meta name="description" content="Quiet heads-up for friends nearby.">
  <meta name="theme-color" content="#0E0F11">
  <style>
    @font-face { font-family: Estedad; src: url("fonts/Estedad-Regular.woff2") format("woff2"); font-display: swap; }
    :root { --bg: #0E0F11; --surface: #17181B; --line: #212226; --text: #ECECEE; --dim: #8B8E95; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Tahoma, sans-serif; padding: 24px 16px; }
    main { width: 100%; max-width: 360px; text-align: center; }
    h1 { font-size: 28px; font-weight: 600; letter-spacing: 8px; margin: 0 0 6px; }
    p { color: var(--dim); margin: 0 0 28px; }
    a.btn { display: block; padding: 14px; border-radius: 14px; text-decoration: none; font-weight: 600; margin-bottom: 12px; }
    a.primary { background: var(--text); color: var(--bg); }
    a.secondary { border: 1px solid var(--line); color: var(--text); }
    .fa { direction: rtl; font-family: Estedad, system-ui, sans-serif; margin-top: 36px; padding-top: 24px; border-top: 1px solid var(--line); }
    .fa p { margin-bottom: 0; }
  </style>
</head>
<body>
  <main>
    <h1>RRR</h1>
    <p>Quiet heads-up for friends nearby.</p>
    <a class="btn primary" href="rrr.apk">Download for Android</a>
    <a class="btn secondary" href="j/">Open in the browser</a>
    <div class="fa" lang="fa">
      <p>هشدار بی‌صدا به دوستانِ نزدیک. برنامه‌ی اندروید را دانلود کن یا در مرورگر باز کن.</p>
    </div>
  </main>
</body>
</html>
